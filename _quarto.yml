project:
  type: website
  output-dir: docs
  resources:
    - img/home/*

website:
  title: "Jonáš Gaigr"
  description: "Personal website of Jonáš Gaigr, ecologist and conservationist at the Nature Conservation Agency of the Czech Republic and PhD student at the Faculty of Environmental Sciences, Czech University of Life Sciences Prague."
  site-url: "https://jonasgaigr.github.io"
  favicon: img/jonas_gaigr.jpg
  image: img/jonas_gaigr.jpg
  page-navigation: false

  page-footer:
    left: "&copy; 2026 Jonáš Gaigr"
    right: "This page is built with 🌿 and [Quarto](https://quarto.org/)."

  repo-url: "https://github.com/jonasgaigr/jonasgaigr.github.io"

  navbar:
    title: "Jonáš Gaigr"
    collapse-below: lg
    right:
      - text: "Projects"
        href: projects.qmd
      - text: "CV"
        href: cv.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Get in touch"
        href: contact.qmd

format:
  html:
    theme:
      - cosmo
      - styles.scss
    css: styles.css
    toc: true
    toc-depth: 2
    title-block-banner: true
    link-external-newwindow: true
